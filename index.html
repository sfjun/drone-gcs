<!-- index.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소방 관제 센터 [DEMO v1.0]</title>
    <link rel="stylesheet" href="/static/css/style.css">

    <!-- COMMAND CHAT 전용 CSS -->
    <style>
        #chat-log-area {
            flex: 1;
            background: #0b141a;
            border: 1px solid #1e293b;
            color: #cbd5e1;
            font-family: "Consolas", monospace;
            padding: 10px;
            overflow-y: auto;
            border-radius: 0 4px 4px 4px;
            font-size: 10pt;
            margin-bottom: 6px;
            min-height: 120px;
        }

        .chat-message {
            display: flex;
            flex-direction: column;
            width: fit-content;
            max-width: 78%;
            padding: 7px 10px;
            margin: 6px 0;
            border-radius: 8px;
            word-break: break-word;
            line-height: 1.4;
            box-sizing: border-box;
        }

        .chat-message.sent {
            margin-left: auto;
            background: #1d4ed8;
            color: white;
            border-bottom-right-radius: 2px;
        }

        .chat-message.received {
            margin-right: auto;
            background: #1e293b;
            color: #e2e8f0;
            border: 1px solid #334155;
            border-bottom-left-radius: 2px;
        }

        .chat-message.system {
            margin-left: auto;
            margin-right: auto;
            background: rgba(14, 165, 233, 0.10);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.25);
            text-align: center;
            max-width: 95%;
        }

        .chat-meta {
            font-size: 9px;
            opacity: 0.65;
            margin-bottom: 3px;
        }

        .chat-text {
            font-size: 13px;
        }

        #chat-input {
            flex: 1;
            margin-bottom: 0;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            padding: 8px;
            outline: none;
            border-radius: 4px;
        }

        #chat-input:focus {
            border-color: #38bdf8;
        }
    </style>
</head>

<body>

        <!-- 1. 왼쪽 그룹 (타이틀 + 소방차 버튼 + 상태) -->

            <h1 style="margin: 0; font-size: 1.8rem; white-space: nowrap;">소방 관제 센터</h1> 
            
            <button id="btn-open-car" onclick="window.open('/car', '_blank', 'width=960,height=540')" style="padding: 8px 16px; background: #ef4444; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); font-size: 0.9rem; z-index: 999; white-space: nowrap;"> 
                🚒 출동 소방차 화면 열기 
            </button>
            
            <div id="status-label" style="font-size: 1.1rem; font-weight: bold; color: #f38ba8; white-space: nowrap; display: flex; align-items: center;">

    <!-- ✨ 드롭다운 자동완성(디바운스) 스크립트 ✨ -->
    <script>
        // let 대신 window. 을 붙여줍니다.
        window.searchTimeout = null; 

        window.handleAutoSearch = function() {
            const query = document.getElementById('address-input').value;
            const dropdown = document.getElementById('search-results-dropdown');

            if (!query.trim()) {
                if (dropdown) dropdown.style.display = 'none';
                if (window.searchTimeout) clearTimeout(window.searchTimeout);
                return;
            }

            if (window.searchTimeout) clearTimeout(window.searchTimeout);

            window.searchTimeout = setTimeout(() => {
                if (typeof window.searchAddress === 'function') {
                    window.searchAddress();
                }
            }, 300);
        };
    </script>

    <script>
        // 페이지를 떠나려고 할 때 발생하는 이벤트 감지
        window.addEventListener('beforeunload', function (event) {
            // 표준 명세에 따른 설정 (크롬, 파이어폭스 등에서 필수)
            event.preventDefault();
            
            // 크롬 및 일부 브라우저에서 경고창을 띄우기 위해 returnValue 설정 필수
            // (과거와 달리 현대 브라우저는 커스텀 문구 지정을 무시하고 브라우저 기본 문구를 보여줍니다)
            event.returnValue = ''; 
        });
    </script>

    <!-- 기상 정보 업데이트 스크립트 -->
    <script>
        // 1. 방위 변환 함수
        function getDirectionText(degree) {
            if (degree === null || degree === undefined) return '';
            const directions = ['북', '북동', '동', '남동', '남', '남서', '서', '북서', '북'];
            const index = Math.round((degree % 360) / 45);
            return `(${directions[index]})`;
        }

        // 2. 날씨 코드(숫자)를 한글 상태 문구로 변환하는 함수
        function getWeatherConditionText(weatherCode, ptyCode) {
            // 기상청 비/눈 데이터 최우선 반영
            if (ptyCode !== undefined && ptyCode !== null && ptyCode > 0) {
                if (ptyCode === 1 || ptyCode === 5) return '비 🌧️';
                if (ptyCode === 2 || ptyCode === 6) return '비/눈 🌨️';
                if (ptyCode === 3 || ptyCode === 7) return '눈 ❄️';
            }
            
            // Open-Meteo 코드 변환
            if (weatherCode !== undefined && weatherCode !== null) {
                if (weatherCode === 0) return '맑음 ☀️';
                if (weatherCode === 1 || weatherCode === 2) return '구름조금 🌤️';
                if (weatherCode === 3) return '흐림 ☁️';
                if ([45, 48].includes(weatherCode)) return '안개 🌫️';
                if ([51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82].includes(weatherCode)) return '비 🌧️';
                if ([71, 73, 75, 77, 85, 86].includes(weatherCode)) return '눈 ❄️';
                if ([95, 96, 99].includes(weatherCode)) return '뇌우 ⛈️';
            }
            return '--';
        }

        async function fetchWeatherData(lat = 37.5665, lon = 126.9780) { 
            try {
                const response = await fetch(`/api/weather?lat=${lat}&lon=${lon}`);
                if (!response.ok) throw new Error("서버 응답 오류");
                const data = await response.json();

                // UI 매핑
                document.getElementById('w-speed').innerText = data.wind_speed !== null ? `${data.wind_speed} m/s` : '-- m/s';
                document.getElementById('w-dir').innerText = data.wind_direction !== null 
                    ? `${data.wind_direction}° ${getDirectionText(data.wind_direction)}` 
                    : '-- °';
                    
                // 기상 상태 UI에 텍스트 적용
                document.getElementById('w-cond').innerText = getWeatherConditionText(data.weather_code, data.precipitation_type);
                
                document.getElementById('w-vis').innerText = data.visibility_km !== undefined && data.visibility_km !== null 
                    ? `${data.visibility_km} km` 
                    : '-- km';

                const statusEl = document.getElementById('w-status');
                if (data.risk) {
                    statusEl.innerText = data.risk.level;
                    statusEl.title = data.risk.action;

                    if (data.risk.level === 'HIGH') {
                        statusEl.style.color = '#ef4444';
                    } else if (data.risk.level === 'CAUTION') {
                        statusEl.style.color = '#facc15';
                    } else {
                        statusEl.style.color = '#10b981';
                    }
                }
            } catch (error) {
                console.error("기상 정보를 가져오는데 실패했습니다:", error);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            fetchWeatherData();
            setInterval(() => fetchWeatherData(), 600000); 
        });
    </script>
</body>
</html>
