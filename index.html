<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>AI Drone GCS (Web)</title>
    <!-- PyScript 제거 완료! 훨씬 가볍고 빨라집니다. -->
    
    <!-- 지도 연동을 위한 Leaflet.js -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        /* (디자인은 이전과 동일하게 유지) */
        body { background-color: #0b141a; color: #e2e8f0; font-family: 'Pretendard', sans-serif; display: flex; flex-direction: column; margin: 0; height: 100vh; padding: 20px; box-sizing: border-box; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { font-size: 22px; margin: 0; color: #ffffff; letter-spacing: 1px; }
        .status-label { font-size: 16px; font-weight: bold; color: #f38ba8; }
        .content { display: flex; gap: 20px; flex: 1; height: calc(100% - 60px); }
        .panel { background: #0f172a; border: 1px solid #1e293b; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; }
        .left { flex: 1.5; } .center { flex: 3.5; } .right { flex: 3; }
        
        input[type="text"] { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 5px; padding: 10px; margin-bottom: 10px; width: 100%; box-sizing: border-box; font-size: 10pt; }
        button { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 5px; padding: 12px; margin-bottom: 10px; cursor: pointer; font-weight: bold; font-size: 11pt; width: 100%; transition: 0.2s;}
        button:hover:not(:disabled) { background: #334155; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-green { background: #16a34a; border: none; } .btn-green:hover:not(:disabled) { background: #15803d; }
        .btn-red { background: #dc2626; border: none; } .btn-red:hover:not(:disabled) { background: #b91c1c; }
        .btn-orange { background: #ea580c; border: none; } .btn-orange:hover:not(:disabled) { background: #c2410c; }
        .btn-blue { background: #0284c7; border: none; } .btn-blue:hover:not(:disabled) { background: #0369a1; }
        .btn-gray { background: #475569; border: none; } .btn-gray:hover:not(:disabled) { background: #334155; }
        
        h3 { color: #94a3b8; font-size: 14px; margin-top: 0; margin-bottom: 15px;}
        .data-text { color: #38bdf8; font-size: 18px; font-weight: bold; }
        
        .tabs { display: flex; gap: 5px; margin-bottom: -1px; }
        .tab-btn { width: auto; padding: 8px 15px; margin-bottom: 0; border-bottom-left-radius: 0; border-bottom-right-radius: 0; background: #0b141a; color: #94a3b8; font-size: 10pt; border: 1px solid transparent; }
        .tab-btn.active { background: #0f172a; color: #38bdf8; border: 1px solid #1e293b; border-bottom: 3px solid #38bdf8; }
        
        .video-container { background-color: #000; flex: 1; display: flex; align-items: center; justify-content: center; border-radius: 0 5px 5px 5px; border: 1px solid #1e293b; margin-bottom: 15px; overflow: hidden; position: relative;}
        #video-canvas { width: 100%; height: 100%; object-fit: contain; }
        
        #map { flex: 1; border-radius: 5px; min-height: 200px; margin-bottom: 15px; }
        #log-area { background: #0b141a; border: 1px solid #1e293b; color: #cbd5e1; font-family: 'Consolas', monospace; padding: 10px; height: 120px; overflow-y: auto; border-radius: 5px; font-size: 10pt;}

        .risk-row { display: flex; align-items: center; margin-bottom: 10px; font-size: 10pt; color: #cbd5e1; }
        .risk-label { width: 60px; }
        .progress-bg { flex: 1; background-color: #1e293b; height: 10px; border-radius: 5px; overflow: hidden; }
        .progress-fill { background-color: #38bdf8; height: 100%; border-radius: 5px; transition: width 0.5s ease; }
    </style>
</head>
<body>
    <div class="header">
        <h1>AI DRONE SAFETY INTELLIGENCE (Web)</h1>
        <div id="status-label" class="status-label">상태: 연결 끊김 🔴</div>
    </div>
    <div class="content">
        <!-- 좌측 컨트롤 패널 -->
        <div class="panel left">
            <h3>DRONE / FLIGHT STATUS</h3>
            <p>MODE: <span id="mode" class="data-text">STANDBY</span></p>
            <p>ALT: <span id="alt" class="data-text">0.0</span> m</p>
            <p>GPS: <span id="gps" class="data-text" style="font-size: 14px;">대기 중...</span></p>
            <hr style="border-color: #1e293b; width: 100%; margin: 15px 0;">
            
            <h3>COMMAND CONTROL</h3>
            <input type="text" id="ip-input" placeholder="예: udp:0.0.0.0:14560" value="udp:0.0.0.0:14560">
            <div style="display: flex; gap: 10px;">
                <!-- onclick 이벤트로 자바스크립트 함수 호출 -->
                <button id="btn-connect" class="btn-blue" onclick="connectWebSocket()">연결 시작</button>
                <button id="btn-disconnect" class="btn-gray" onclick="disconnectWebSocket()" disabled>연결 해제</button>
            </div>
            
            <hr style="border-color: #1e293b; width: 100%; margin: 15px 0;">
            
            <div style="display: flex; gap: 10px;">
                <button class="btn-green" onclick="sendCommand('ARM')">시동 (ARM)</button>
                <button class="btn-red" onclick="sendCommand('DISARM')">시동 끄기</button>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn-orange" onclick="sendCommand('TAKEOFF')">이륙</button>
                <button class="btn-red" onclick="sendCommand('LAND')">착륙</button>
            </div>
        </div>

        <!-- 중앙 패널 -->
        <div class="panel center">
            <div class="tabs">
                <button class="tab-btn active">RGB LIVE</button>
                <button class="tab-btn">THERMAL</button>
                <button class="tab-btn">AI OVERLAY</button>
            </div>
            <div class="video-container">
                <canvas id="video-canvas" width="640" height="480"></canvas>
            </div>
            <h3>EVENT TIMELINE / LOG</h3>
            <div id="log-area">시스템 대기 중...<br></div>
        </div>

        <!-- 우측 패널 -->
        <div class="panel right">
            <h3>SITUATION MAP</h3>
            <div id="map"></div>
            <h3>AI RISK SUMMARY</h3>
            <div class="risk-row"><span class="risk-label">화염</span><div class="progress-bg"><div class="progress-fill" style="width: 80%; background-color: #ef4444;"></div></div></div>
            <div class="risk-row"><span class="risk-label">연기</span><div class="progress-bg"><div class="progress-fill" style="width: 20%; background-color: #94a3b8;"></div></div></div>
            <div class="risk-row"><span class="risk-label">요구조자</span><div class="progress-bg"><div class="progress-fill" style="width: 65%; background-color: #3b82f6;"></div></div></div>
            <div class="risk-row"><span class="risk-label">고온점</span><div class="progress-bg"><div class="progress-fill" style="width: 45%; background-color: #f59e0b;"></div></div></div>
        </div>
    </div>

    <!-- 스크립트 영역: WebSocket과 UI 제어 -->
    <!-- 스크립트 영역: WebSocket과 UI 제어 -->
    <script>
        var map = L.map('map').setView([37.5665, 126.9780], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        var marker = L.marker([37.5665, 126.9780]).addTo(map);
        
        function moveMarker(lat, lon) {
            var newLatLng = new L.LatLng(lat, lon);
            marker.setLatLng(newLatLng);
            map.panTo(newLatLng);
        }

        function addLog(msg) {
            const logDiv = document.getElementById("log-area");
            const now = new Date();
            const timeStr = now.toTimeString().split(' ')[0];
            logDiv.innerHTML += `[${timeStr}] ${msg}<br>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        let ws = null;
        let isConnected = false;

        function connectWebSocket() {
            if (isConnected) return;
            const ipVal = document.getElementById("ip-input").value.trim();
            if (!ipVal) return addLog("⚠️ 연결 주소를 입력하세요.");

            addLog("📡 서버로 웹소켓 연결 시도 중...");
            // 브라우저 주소창의 IP와 포트를 자동으로 가져오도록 변경 (백틱 ` 사용 주의!)
            ws = new WebSocket(`ws://${window.location.host}/ws/drone`);

            ws.onopen = function() {
                isConnected = true;
                addLog("🟢 백엔드 웹소켓 연결 완료! 드론 연결을 시도합니다...");
                document.getElementById("status-label").innerText = `상태: 서버 연결됨 🟢`;
                document.getElementById("status-label").style.color = "#a6e3a1";
                document.getElementById("btn-connect").disabled = true;
                document.getElementById("btn-disconnect").disabled = false;
                
                // 🚀 파이썬 서버로 드론 연결하라고 MAVLink 주소 던지기
                ws.send("CONNECT:" + ipVal);
            };

            ws.onmessage = function(event) {
                const msg = JSON.parse(event.data);
                
                // 파이썬 DroneManager에서 온 데이터 종류에 따라 화면 갱신
                if (msg.type === "LOG") {
                    addLog(`[DRONE] ${msg.data}`);
                } 
                else if (msg.type === "GPS") {
                    document.getElementById("alt").innerText = msg.data.alt.toFixed(1);
                    document.getElementById("gps").innerText = `${msg.data.lat.toFixed(5)},\n${msg.data.lon.toFixed(5)}`;
                    moveMarker(msg.data.lat, msg.data.lon);
                }
            };

            ws.onerror = () => addLog("❌ 웹소켓 에러 발생.");
            ws.onclose = () => {
                isConnected = false;
                document.getElementById("status-label").innerText = "상태: 연결 끊김 🔴";
                document.getElementById("status-label").style.color = "#f38ba8";
                document.getElementById("btn-connect").disabled = false;
                document.getElementById("btn-disconnect").disabled = true;
            };
        }

        function disconnectWebSocket() {
            if (ws && isConnected) {
                ws.send("DISCONNECT");
                ws.close();
            }
        }

        function sendCommand(command) {
            if (!isConnected || !ws) return addLog("명령 불가: 서버와 연결되지 않았습니다.");
            ws.send(command);
        }

        function drawStandbyFrame(text) {
            const canvas = document.getElementById('video-canvas');
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 24px "Consolas"';
            ctx.textAlign = 'center';
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);
        }
        window.onload = () => drawStandbyFrame("WAITING FOR SIGNAL...");
    </script>
</body>
</html>
