<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>브이월드 2D 오픈레이어스 지도 (Live Server)</title>
    <!-- OpenLayers 최신 스타일시트 로드 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@latest/ol.css" type="text/css" />
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        /* 1. 지도가 표시되는 메인 div 레이아웃 */
        #map {
            width: 100%;
            height: 100%;
            position: relative; /* 자식 요소인 검색창 배치의 기준점 */
            background-color: #f4f4f4; /* 지도 로딩 전 기본 배경색 */
        }

        /* 2. 지도 좌측 상단 위에 얹어지는 검색 컨트롤 박스 스타일 */
        .search-box {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000; /* 지도 레이어보다 무조건 위에 배치 */
            display: flex;
            background: white;
            padding: 5px;
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        .search-box input {
            width: 250px;
            height: 32px;
            border: 1px solid #ddd;
            padding: 0 10px;
            border-radius: 4px 0 0 4px;
            outline: none;
            font-size: 14px;
        }

        .search-box button {
            width: 60px;
            height: 34px;
            background-color: #4A90E2;
            color: white;
            border: none;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .search-box button:hover {
            background-color: #357ABD;
        }
    </style>
    <!-- <script type="text/javascript" src="https://map.vworld.kr/js/3dmapInit.js.do?apiKey=307B0E17-0322-43C3-A570-59947C0FC7A1&domain=http://127.0.0.1:5500"></script> -->
    <script type="text/javascript" src="https://map.vworld.kr/js/webglMapInit.js.do?apiKey=307B0E17-0322-43C3-A570-59947C0FC7A1&domain=http://127.0.0.1:5500"></script>
    <!-- <script src="https://map.vworld.kr/openapi/js?version=2.0&apiKey=307B0E17-0322-43C3-A570-59947C0FC7A1&domain=http://127.0.0.1:5500"></script>
    OpenLayers 핵심 스크립트 라이브러리 로드 -->
    
    <script src="https://cdn.jsdelivr.net/npm/ol@latest/dist/ol.js"></script>
    <!-- <script type="text/javascript" src="https://map.vworld.kr/js/vworldWebGL3D.js.do?apiKey=307B0E17-0322-43C3-A570-59947C0FC7A1&domain=http://127.0.0.1:5500"></script> -->
    
  </head>
<body>

    <!-- 지도가 표시되는 컨테이너 div 태그 -->
    <div id="map" style="width: 50%; height: 600px; float: left;">
        <!-- 지도 div 태그 내부 좌측 상단에 배치되는 주소 검색창 구조 -->
        <div class="search-box">
            <!-- [수정] 플레이스홀더 문구 변경 및 기본 로드 주소를 도로명(세종대로 110)으로 변경 -->
            <input type="text" id="searchKeyword" placeholder="주소, 도로명 또는 장소 입력..." value="세종대로 110">
            <button onclick="searchLocation()">검색</button>
        </div>
    </div>
    <div id="map3d" style="width: 50%; height: 600px; float: left;"></div>
    <div style="clear: both;"></div>

    <script>
        // 1. 등록하신 브이월드 API 인증키 및 도메인 상수 정의
        const VWORLD_KEY = "307B0E17-0322-43C3-A570-59947C0FC7A1";
        const ALLOWED_DOMAIN = "http://127.0.0.1:5500";

        // 2. 브이월드 WMTS 타일 소스 설정 (공식 게이트웨이 주소로 정상화)
        const vworldSource = new ol.source.XYZ({
            // 100% 검증된 브이월드 2D 표준 타일 주소
            url: "https://api.vworld.kr/req/wmts/1.0.0/" + VWORLD_KEY + "/Base/{z}/{y}/{x}.png",
            crossOrigin: 'anonymous' 
        });
        
        // 3. 타일 레이어 생성
        const vworldLayer = new ol.layer.Tile({
            source: vworldSource
        });


        // =========================================================
        // [★ 추가] 비행금지·비행제한(WMS) 및 실제 NOTAM(Vector) 레이어를 새로 개설합니다.
        // =========================================================
        const droneAirspaceSource = new ol.source.TileWMS({
            url: "https://api.vworld.kr/req/wms",
            // crossOrigin: 'anonymous',
            params: {
                'SERVICE': 'WMS',
                'VERSION': '1.3.0',
                'REQUEST': 'GetMap',
                'KEY': VWORLD_KEY,
                // 'DOMAIN': ALLOWED_DOMAIN,
                'DOMAIN': ALLOWED_DOMAIN,
                // 'LAYERS': 'lt_c_aisiarez,lt_c_aisfrez,lt_c_aisctrz', // 비행제한, 비행금지, 관제권
                'LAYERS': 'lt_c_aisprhc,lt_c_aisresc',// 비행제한, 비행금지, 관제권
                'CRS': 'EPSG:3857',
                'FORMAT': 'image/png',
                'TRANSPARENT': 'TRUE'
            }            
        });

        const droneAirspaceLayer = new ol.layer.Tile({
            source: droneAirspaceSource,
            opacity: 0.45 // 공역 구역 반투명도 설정 (40%)
        });

        const notamSource = new ol.source.Vector();
        const notamLayer = new ol.layer.Vector({
            source: notamSource,
            style: new ol.style.Style({
                fill: new ol.style.Fill({ color: 'rgba(255, 100, 0, 0.15)' }), // 연한 주황색
                stroke: new ol.style.Stroke({ color: '#ff6400', width: 2, lineDash: [4, 4] }) // 주황색 점선
            })
        });



        /* =========================================================================
           [★ 추가 부분 1] 마커(빨간 원)를 지도 위에 그리기 위한 전용 레이어와 소스 선언
           ========================================================================= */
        const markerSource = new ol.source.Vector();
        const markerLayer = new ol.layer.Vector({
            source: markerSource
        });

        // 4. 지도 인스턴스 초기화 및 메인 div 매핑
        const map = new ol.Map({
            target: 'map', // target 속성으로 id="map"을 가진 div를 지정합니다.
            // [★ 수정 부분 2] 지도 레이어 뒤에 마커 레이어(markerLayer)를 함께 얹어줍니다.
            layers: [vworldLayer, droneAirspaceLayer, notamLayer, markerLayer],
            view: new ol.View({
                // 대한민국 중심 좌표 설정 (EPSG:3857 변환, 초기: 서울시청)
                center: ol.proj.fromLonLat([126.9784, 37.5666]), 
                zoom: 12,
                minZoom: 6,
                maxZoom: 19
            })
        });

        // =========================================================================
        // [★ 추가] 실제 공공 API 또는 NOTAM 수신 전문 데이터를 시각화하는 파싱 연동 함수
        // =========================================================================
        function parseAndMapActualNotam(apiResponseData) {
            notamSource.clear();

            // 실제 API에서 받아오는 ICAO 표준 및 국토교통부 표준 NOTAM 데이터 배열 규격 예시
            const actualNotamList = apiResponseData || [
                {
                    notamId: "C0812/26",
                    fullText: "Q) RPHI/QFAXX/IV/NBO/A/000/999/375666N1269784E002", // Q항목 좌표 파싱용 (375666N 1269784E 반경 2해리)
                    centerLonLat: [126.9784, 37.5666], // 전문에서 파싱되어 적출된 기준 경위도
                    radiusMeter: 3704, // 전문 끝의 002(2해리) 단위를 미터법(1NM = 1,852m)으로 자동 환산한 실제 값
                    purpose: "드론 임시 통제 제한 고시"
                }
            ];

            actualNotamList.forEach(notam => {
                // 1) 단일 포인트 + 반경 형태의 노탐 구역 매핑 (ol.geom.Polygon.circular 방식)
                if (notam.centerLonLat && notam.radiusMeter > 0) {
                    const circularGeo = ol.geom.Polygon.circular(notam.centerLonLat, notam.radiusMeter);
                    
                    const notamFeature = new ol.Feature({
                        geometry: circularGeo.transform('EPSG:4326', 'EPSG:3857'), // 경위도를 지도 좌표계로 변환
                        notamId: notam.notamId,
                        content: notam.purpose
                    });
                    notamSource.addFeature(notamFeature);
                } 
                // 2) 다각 폴리곤 형태의 다중 좌표 노탐인 경우 (전문 내 다중 좌표점이 매핑된 경우)
                else if (notam.polygonCoordinates) {
                    const polygonGeo = new ol.geom.Polygon([notam.polygonCoordinates]);
                    const notamFeature = new ol.Feature({
                        geometry: polygonGeo.transform('EPSG:4326', 'EPSG:3857'),
                        notamId: notam.notamId
                    });
                    notamSource.addFeature(notamFeature);
                }
            });
        }

        // 앱 초기 구동 시 실제 NOTAM 매핑 시각화 실행 (실제 연동 시 fetch() 결과 데이터를 인자로 주입)
        parseAndMapActualNotam();


        // 5. 브이월드 명칭/주소 검색 API를 호출하여 지도를 이동시키는 검색 기능 구현
        function searchLocation() {
            const keyword = document.getElementById('searchKeyword').value;
            if (!keyword.trim()) {
                alert("검색어를 입력해 주세요.");
                return;
            }

            const callbackName = 'vworldCallback_' + Math.round(100000 * Math.random());
            
            /* =========================================================================
               [★ 수정 부분 3] 장소명(PLACE)과 도로명/지번 주소(ADDRESS) 검색을 모두 처리하는 로직
               ========================================================================= */
            const baseUrl = "https://api.vworld.kr/req/search";

            /* =========================================================================
               [★ 하이라이트: 수정] PARAM_REQUIRED 오류를 해결하기 위해 category 파라미터 자동 동적 분기 생성
               ========================================================================= */
            const isAddress = /\d/.test(keyword);
            const searchType = isAddress ? "ADDRESS" : "PLACE";
            // const categoryParam = isAddress ? "&category=road,parcel" : ""; // 주소 검색 시 필수 값 지정
            const categoryParam = isAddress ? "&category=ROAD" : "";
            // 입력된 검색어에 숫자가 포함되어 있으면 도로명/지번(ADDRESS)으로 처리하고, 없으면 명칭(PLACE)으로 유연하게 전환합니다.
            // const searchType = /\d/.test(keyword) ? "ADDRESS" : "PLACE";
            
            const searchUrl = baseUrl
                            + "?service=search&request=search&version=2.0"
                            + "&crs=EPSG:3857" 
                            + "&size=5&page=1"
                            + "&type=" + searchType // <--- 유연하게 변경된 타입 대입
                            + categoryParam 
                            + "&query=" + encodeURIComponent(keyword)
                            + "&key=" + VWORLD_KEY
                            + "&domain=" + encodeURIComponent(ALLOWED_DOMAIN)
                            + "&callback=" + callbackName;

            const script = document.createElement('script');
            script.src = searchUrl;

            window[callbackName] = function(data) {
                if (data.response && data.response.status === "OK" && data.response.result && data.response.result.items.length > 0) {  
                    const firstResult = data.response.result.items[0]; // 배열의 첫 번째 결과 항목 지정
                    
                    const posX = parseFloat(firstResult.point.x);
                    const posY = parseFloat(firstResult.point.y);

                    /* =========================================================================
                       [★ 추가 부분 4] 기존 마커를 지우고 새로운 검색 위치에 빨간 원 마커 생성 및 스타일 정의
                       ========================================================================= */
                    // 1) 이전 검색으로 찍혀있던 마커 청소
                    markerSource.clear();

                    // 2) 새로운 마커 포인트 데이터 구성
                    const markerFeature = new ol.Feature({
                        geometry: new ol.geom.Point([posX, posY])
                    });

                    // 3) 선명한 흰색 테두리를 가진 빨간색 원형 스타일 지정
                    const markerStyle = new ol.style.Style({
                        image: new ol.style.Circle({
                            radius: 10, // 원의 크기
                            fill: new ol.style.Fill({ color: '#ff0000' }), // 내부 빨간색
                            stroke: new ol.style.Stroke({ color: '#ffffff', width: 3 }) // 테두리 흰색 두께 3px
                        })
                    });
                    
                    markerFeature.setStyle(markerStyle);
                    markerSource.addFeature(markerFeature); // 마커 레이어 소스에 추가

                    // 지도 시점(View)을 해당 좌표 위치로 부드럽게 이동 및 확대
                    map.getView().animate({
                        center: [posX, posY],
                        zoom: 17, // 마커가 뚜렷하게 보이도록 확대 레벨을 기존 16에서 17로 상향
                        duration: 800
                    });
                } else {
                    console.log("브이월드 응답 데이터 원본:", data);
                    alert("검색 결과를 찾을 수 없습니다. (키워드 확인 또는 브이월드 키의 도메인 매핑 설정을 체크하세요.)");
                }

                document.body.removeChild(script);
                delete window[callbackName];
            };

            script.onerror = function() {
                console.error("검색 API 스크립트 로드 오류");
                alert("API 서버와의 연동에 실패했습니다.");
                document.body.removeChild(script);
                delete window[callbackName];
            };

            document.body.appendChild(script);
        }

        // 입력창에서 엔터키를 입력해도 검색 기능이 동시 동작하도록 이벤트 바인딩
        document.getElementById('searchKeyword').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                searchLocation();
            }
        });

        // 오류 추적용 모니터링 이벤트 리스너
        vworldSource.on('tileloaderror', function() {
            console.error(`[브이월드 에러] 타일을 불러오지 못했습니다. 브이월드 개발자센터에 등록된 도메인이 '${ALLOWED_DOMAIN}'과 정확히 일치하는지 확인해 주세요.`);
        });
    </script>
    <script>
    let map3d = null;

    window.onload = function() {
        setTimeout(function() {
            if (typeof vw !== 'undefined' && typeof vw.Map !== 'undefined') {
                var mapOptions = new vw.MapOptions(
                    vw.BasemapType.GRAPHIC, 
                    "", 
                    vw.DensityType.BASIC, 
                    vw.DensityType.BASIC, 
                    false, 
                    new vw.CameraPosition(new vw.CoordZ(126.97794, 37.56632, 2000), new vw.Direction(0, -45, 0))
                );
                map3d = new vw.Map("map3d", mapOptions);
                
                if (typeof initMapSync === 'function') {
                    initMapSync();
                }
                console.log("브이월드 3D 지도가 성공적으로 로드되었습니다.");
            } else {
                console.error("오류: 브이월드 서버 응답 지연으로 객체를 가져오지 못했습니다.");
            }
      }, 1500);
    };

    function initMapSync() {
      if (typeof map === 'undefined' || !map || typeof map3d === 'undefined' || !map3d) {
          return;
      }

      const view2d = map.getView();

      // 2D 지도 움직임 실시간 감지
      view2d.on('change:center', syncCamera);
      view2d.on('change:resolution', syncCamera);

      function syncCamera() {
        const center3857 = view2d.getCenter();
        if (!center3857) return;

        // 1. 2D 지도의 현재 중심 좌표를 3D용 위경도로 변환
        const center4326 = ol.proj.toLonLat(center3857);
        const lon = center4326[0]; // 경도
        const lat = center4326[1]; // 위도

        // 2. 2D 지도의 현재 줌 레벨을 추출하여 3D 카메라 고도(높이) 환산
        const zoom = view2d.getZoom();
        const altitude = Math.pow(2, (19 - zoom)) * 200; 

        // 💡 3. 통합 API 버전 전용 3D 카메라 직접 이동 및 고도 설정 함수입니다.
        if (map3d && typeof map3d.moveLonLat === 'function') {
            map3d.moveLonLat(lon, lat); // 3D 지도를 해당 위경도로 즉시 이동
            map3d.setAltitude(altitude); // 줌 레벨에 맞는 높이 동기화
        } else if (map3d && map3d.getViewCamera) {
            // 일부 하위 빌드 호환용 보완 구조입니다.
            map3d.getViewCamera().moveLonLat(lon, lat);
            map3d.getViewCamera().setAltitude(altitude);
        }
      }

      syncCamera(); // 초기 위치 매칭
    }
    
    </script>
</body>
</html>
