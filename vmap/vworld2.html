<!DOCTYPE html>
  <html lang="ko">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
      <title>휴게소정보조회서비스</title>
      <link rel="stylesheet" href="https://openlayers.org/en/v6.15.1/css/ol.css" type="text/css"/>
      <script src="https://openlayers.org/en/v6.15.1/build/ol.js"></script>
      <script src="https://code.jquery.com/jquery-2.2.3.min.js"></script>
      <style>
          html, body {
              margin: 0;
              height: 100%;
          }
  
          #vmap {
              position: absolute;
              inset: 0;
              width: 100%;
              height: 100%;
          }
  
          #search {
              position: absolute;
              top: 14px;
              left: 14px;
              z-index: 10;
              width: 320px;
              max-width: calc(100% - 28px);
              font-family: 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif;
          }
  
          .search-box {
              display: flex;
              align-items: center;
              gap: 8px;
              padding: 0 12px;
              height: 44px;
              background: #fff;
              border-radius: 22px;
              box-shadow: 0 4px 16px rgba(0, 0, 0, .18);
          }
  
          .search-box .icon {
              font-size: 15px;
              color: #8a99ab;
          }
  
          #search-input {
              flex: 1;
              border: 0;
              outline: 0;
              font-size: 14px;
              font-family: inherit;
              color: #222;
              background: transparent;
          }
  
          #search-input::placeholder {
              color: #a8b2bd;
          }
  
          #search-clear {
              display: none;
              width: 20px;
              height: 20px;
              border: 0;
              border-radius: 50%;
              background: #e6eaf0;
              color: #6b7684;
              font-size: 13px;
              line-height: 1;
              cursor: pointer;
          }
  
          #search.has-text #search-clear {
              display: block;
          }
  
          #search-result {
              display: none;
              margin-top: 8px;
              max-height: 320px;
              overflow-y: auto;
              background: #fff;
              border-radius: 12px;
              box-shadow: 0 8px 24px rgba(0, 0, 0, .18);
          }
  
          #search-result.is-open {
              display: block;
          }
  
          #search-result::-webkit-scrollbar {
              width: 6px;
          }
  
          #search-result::-webkit-scrollbar-thumb {
              background: #d6dde6;
              border-radius: 3px;
          }
  
          .sr-item {
              display: flex;
              align-items: center;
              gap: 10px;
              padding: 10px 14px;
              cursor: pointer;
              border-bottom: 1px solid #f5f6f8;
          }
  
          .sr-item:last-child {
              border-bottom: 0;
          }
  
          .sr-item.active,
          .sr-item:hover {
              background: #f4f8ff;
          }
  
          .sr-pin {
              font-size: 14px;
          }
  
          .sr-name {
              font-size: 13px;
              font-weight: 600;
              color: #222;
          }
  
          .sr-name mark {
              background: transparent;
              color: #1e6fd9;
              font-weight: 700;
          }
  
          .sr-route {
              margin-top: 2px;
              font-size: 11px;
              color: #8a99ab;
          }
  
          .sr-empty {
              padding: 22px 14px;
              text-align: center;
              font-size: 12px;
              color: #9aa5b1;
          }
  
          #popup {
              position: absolute;
              width: 340px;
              box-sizing: border-box;
              font-family: 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif;
              background: #fff;
              border-radius: 14px;
              box-shadow: 0 10px 30px rgba(0, 0, 0, .22);
              overflow: hidden;
              display: none;
          }
  
          #popup.is-open {
              display: block;
          }
  
          .pop-head {
              position: relative;
              padding: 14px 44px 12px 16px;
              background: linear-gradient(135deg, #1e6fd9, #2f9bff);
              color: #fff;
          }
  
          .pop-title {
              font-size: 16px;
              font-weight: 700;
              line-height: 1.3;
          }
  
          .pop-sub {
              margin-top: 4px;
              font-size: 12px;
              opacity: .85;
          }
  
          .pop-closer {
              position: absolute;
              top: 10px;
              right: 10px;
              width: 24px;
              height: 24px;
              border: 0;
              border-radius: 50%;
              background: rgba(255, 255, 255, .2);
              color: #fff;
              font-size: 16px;
              line-height: 1;
              cursor: pointer;
          }
  
          .pop-closer:hover {
              background: rgba(255, 255, 255, .35);
          }
  
          .pop-weather {
              display: flex;
              align-items: center;
              gap: 12px;
              padding: 12px 16px;
              background: #f4f8ff;
              border-bottom: 1px solid #e6eefb;
          }
  
          .w-icon {
              font-size: 28px;
              line-height: 1;
          }
  
          .w-temp {
              font-size: 22px;
              font-weight: 700;
              color: #14386b;
          }
  
          .w-desc {
              font-size: 12px;
              color: #5b7a9e;
          }
  
          .w-chips {
              display: flex;
              flex-wrap: wrap;
              gap: 4px;
              margin-left: auto;
              justify-content: flex-end;
          }
  
          .w-chip {
              font-size: 11px;
              color: #33608f;
              background: #e2edfb;
              border-radius: 10px;
              padding: 2px 8px;
              white-space: nowrap;
          }
  
          .w-empty {
              font-size: 12px;
              color: #8a99ab;
          }
  
          .w-note {
              padding: 6px 16px;
              font-size: 11px;
              color: #a3752f;
              background: #fff8ec;
              border-bottom: 1px solid #e6eefb;
          }
  
          /* ===== 탭 ===== */
          .pop-tabs {
              display: flex;
              border-bottom: 1px solid #eceff3;
          }
  
          .pop-tab {
              flex: 1;
              padding: 10px 0;
              border: 0;
              background: #fff;
              font-size: 12px;
              font-weight: 600;
              color: #8a99ab;
              cursor: pointer;
              border-bottom: 2px solid transparent;
              font-family: inherit;
          }
  
          .pop-tab .cnt {
              display: inline-block;
              min-width: 16px;
              margin-left: 3px;
              padding: 1px 4px;
              border-radius: 8px;
              background: #eef1f5;
              color: #8a99ab;
              font-size: 10px;
          }
  
          .pop-tab.active {
              color: #1e6fd9;
              border-bottom-color: #1e6fd9;
          }
  
          .pop-tab.active .cnt {
              background: #1e6fd9;
              color: #fff;
          }
  
          /* ===== 목록 ===== */
          .pop-body {
              max-height: 260px;
              overflow-y: auto;
              padding: 6px 0;
          }
  
          .pop-body::-webkit-scrollbar {
              width: 6px;
          }
  
          .pop-body::-webkit-scrollbar-thumb {
              background: #d6dde6;
              border-radius: 3px;
          }
  
          .item {
              padding: 9px 16px;
              border-bottom: 1px solid #f5f6f8;
          }
  
          .item:last-child {
              border-bottom: 0;
          }
  
          .item-top {
              display: flex;
              align-items: center;
              gap: 6px;
          }
  
          .item-name {
              font-size: 13px;
              font-weight: 600;
              color: #222;
          }
  
          .item-time {
              margin-left: auto;
              font-size: 11px;
              color: #8a99ab;
              white-space: nowrap;
          }
  
          .badge {
              font-size: 10px;
              padding: 1px 6px;
              border-radius: 8px;
              background: #eef7ee;
              color: #3c8c4a;
          }
  
          .badge.season-여름 {
              background: #fff1e8;
              color: #d1702a;
          }
  
          .badge.season-겨울 {
              background: #eaf2ff;
              color: #2f6fd0;
          }
  
          .item-desc {
              margin-top: 4px;
              font-size: 12px;
              line-height: 1.45;
              color: #6b7684;
              white-space: pre-line;
          }
  
          .empty {
              padding: 28px 16px;
              text-align: center;
              font-size: 12px;
              color: #9aa5b1;
          }
  
          .loading {
              display: flex;
              align-items: center;
              justify-content: center;
              height: 230px;
              font-size: 12px;
              color: #9aa5b1;
          }
      </style>
  </head>
  <body>
  
  
  
  <div id="vmap"></div>
  
  <div id="search">
      <div class="search-box">
          <span class="icon">🔍</span>
          <input id="search-input" type="text" placeholder="휴게소 이름 검색 (예: 용인, ㅇㅇ, 안성)"
                 autocomplete="off" spellcheck="false"/>
          <button type="button" id="search-clear" title="지우기">&times;</button>
      </div>
      <div id="search-result"></div>
  </div>
  
  <div id="popup"></div>
  
  <script>
      /**
          아래 브이월드, 한국도로공사의 오픈API 인증키를 브이월드 활용모델을 제외하고는 이용하지 마세요
      **/
      const VWORLD_KEY = 'E5B1657B-9B6F-3A4B-91EF-98512BE931A1';
      const EX_KEY = '6314338450'
      const restSearch = []
      const restWeather = []
  
      const baseLayer = new ol.layer.Tile({
          source: new ol.source.XYZ({
              url: `https://api.vworld.kr/req/wmts/1.0.0/${VWORLD_KEY}/Base/{z}/{y}/{x}.png`
          })
      });
  
      const restList = new ol.source.Cluster({
          distance: 50,
          source: new ol.source.Vector({
              features: []
          })
      });
  
      const restPoint = new ol.layer.Vector({
          source: restList,
          style: function (clusterFeature) {
              const features = clusterFeature.get('features');
              const size = features.length;
              const label = size > 1 ? String(size) : features[0].get('name');
              return new ol.style.Style({
                  image: new ol.style.Circle({
                      radius: size > 1 ? 14 : 6,
                      fill: new ol.style.Fill({ color: '#007bff' }),
                      stroke: new ol.style.Stroke({ color: '#fff', width: 2 })
                  }),
                  text: new ol.style.Text({
                      text: String(label || ''),
                      font: '12px sans-serif',
                      fill: new ol.style.Fill({ color: size > 1 ? '#fff' : '#111' }),
                      stroke: new ol.style.Stroke({ color: '#fff', width: size > 1 ? 0 : 3 }),
                      offsetY: size > 1 ? 0 : 14
                  })
              });
          }
      });
  
      const map = new ol.Map({
          target: 'vmap',
          layers: [baseLayer, restPoint],
          view: new ol.View({
              center: ol.proj.fromLonLat([127.7669, 35.9078]),
              zoom: 7
          }),
          controls: []
      });
  
      const popupEl = document.getElementById('popup');
      const popup = new ol.Overlay({
          element: popupEl,
          positioning: 'top-center',
          offset: [0, 16],
          stopEvent: true
      });
      map.addOverlay(popup);
  
      const POPUP_GAP = 16;
      const EDGE_MARGIN = 16;
  
  
      function focusOn(coordinate, zoom, onlyIfClipped) {
          const view = map.getView();
          const size = map.getSize();
          if (!size) return;
  
          const popupHeight = popupEl.offsetHeight;
          const halfWidth = popupEl.offsetWidth / 2;
  
          if (onlyIfClipped) {
              const pixel = map.getPixelFromCoordinate(coordinate);
              const fits = pixel &&
                  pixel[1] + POPUP_GAP + popupHeight <= size[1] - EDGE_MARGIN &&
                  pixel[1] >= EDGE_MARGIN &&
                  pixel[0] - halfWidth >= EDGE_MARGIN &&
                  pixel[0] + halfWidth <= size[0] - EDGE_MARGIN;
              if (fits) return;
          }
  
          let pixelY = (size[1] - popupHeight - POPUP_GAP) / 2;
          const minY = EDGE_MARGIN;
          const maxY = size[1] - POPUP_GAP - popupHeight - EDGE_MARGIN;
          pixelY = Math.max(pixelY, minY);
          if (pixelY > maxY && minY <= maxY) pixelY = maxY;
  
          const targetZoom = zoom === undefined ? view.getZoom() : zoom;
          const resolution = view.getResolutionForZoom(targetZoom);
  
          view.animate({
              center: [coordinate[0], coordinate[1] + (pixelY - size[1] / 2) * resolution],
              zoom: targetZoom,
              duration: onlyIfClipped ? 250 : 500
          });
      }
  
      function closePopup() {
          popupEl.classList.remove('is-open');
          popup.setPosition(undefined);
      }
  
      map.on('click', function (e) {
          let hit = false;
          map.forEachFeatureAtPixel(e.pixel, function (clusterFeature) {
              if (hit) return;
              const features = clusterFeature.get('features');
              if (!features) return;
              hit = true;
  
              if (features.length > 1) {
                  const extent = ol.extent.boundingExtent(
                      features.map((feature) => feature.getGeometry().getCoordinates())
                  );
                  if (ol.extent.getWidth(extent) === 0 && ol.extent.getHeight(extent) === 0) {
                      openRestPopup(features[0]);
                      return;
                  }
                  closePopup();
                  map.getView().fit(extent, { padding: [80, 80, 80, 80], maxZoom: 16, duration: 500 });
                  return;
              }
              openRestPopup(features[0]);
          });
          if (!hit) closePopup();
      });
  
      map.on('pointermove', function (e) {
          if (e.dragging) return;
          map.getTargetElement().style.cursor =
              map.hasFeatureAtPixel(e.pixel) ? 'pointer' : '';
      });
  
      function restBrandList(name){
          return $.ajax({
              url: 'https://data.ex.co.kr/openapi/restinfo/restBrandList?',
              type: 'GET',
              dataType: 'json',
              data: {
                  key: EX_KEY,
                  type: 'json',
                  numOfRows: 1000,
                  pageNo: 1,
                  stdRestNm: name
              }
          }).then(function (res) {
              return (res.list || []).map(function (item) {
                  return {
                      name: item.brdName,
                      time: item.stime + ' ~ ' + item.etime,
                  };
              });
          });
      }
  
      function restFoodList(name){
          return $.ajax({
              url: 'https://data.ex.co.kr/openapi/restinfo/restBestfoodList?',
              type: 'GET',
              dataType: 'json',
              data: {
                  key: EX_KEY,
                  type: 'json',
                  numOfRows: 1000,
                  pageNo: 1,
                  stdRestNm: name
              }
          }).then(function (res) {
              return (res.list || []).map(function (item) {
                  return {
                      name: item.foodNm,
                      description: item.etc,
                      material: item.material ? item.material : '정보 없음',
                      season: { '4': '사계절', 'S': '여름', 'W': '겨울' }[item.seasonMenu] ?? '정보 없음',
                  };
              });
          });
      }
  
      function restConvList(name){
          return $.ajax({
              url: 'https://data.ex.co.kr/openapi/restinfo/restConvList?',
              type: 'GET',
              dataType: 'json',
              data: {
                  key: EX_KEY,
                  type: 'json',
                  numOfRows: 1000,
                  pageNo: 1,
                  stdRestNm: name
              }
          }).then(function (res) {
              return (res.list || []).map(function (item) {
                  return {
                      name: item.psName,
                      time: item.stime + ' ~ ' + item.etime,
                      description: item.psDesc,
                  };
              });
          });
      }
  
      (function () {
          const PAGE_SIZE = 100;
          const MAX_PAGE = 5;
          const allFeatures = [];
  
          function fetchPage(pageNo) {
              $.ajax({
                  url: 'https://data.ex.co.kr/openapi/locationinfo/locationinfoRest',
                  type: 'GET',
                  dataType: 'json',
                  data: {
                      key: EX_KEY,
                      type: 'json',
                      numOfRows: PAGE_SIZE,
                      pageNo: pageNo,
                  },
                  success: function (data) {
                      const list = data.list || [];
                      const features = list.map((item) => {
                          const lon = parseFloat(item.xValue);
                          const lat = parseFloat(item.yValue);
                          if (!isFinite(lon) || !isFinite(lat)) return null;
  
                          const name = item.unitName;
                          if (!restSearch[name]) {
                              restSearch[name] = [];
                          }
                          restSearch[name].push({x: lon, y: lat});
  
                          return new ol.Feature({
                              geometry: new ol.geom.Point(ol.proj.fromLonLat([lon, lat])),
                              routeName: item.routeName,
                              routeNo: item.routeNo,
                              serviceAreaCode: item.serviceAreaCode,
                              stdRestCd: item.stdRestCd,
                              unitCode: String(item.unitCode).trim(),
                              name: item.unitName,
                          });
                      }).filter(Boolean);
  
                      allFeatures.push(...features);
  
                      if (list.length > 0 && pageNo < MAX_PAGE) {
                          fetchPage(pageNo + 1);
                      } else {
                          restList.getSource().addFeatures(allFeatures);
                          buildSearchIndex(allFeatures);
                      }
                  },
                  error: function (jqXHR, textStatus, errorThrown) {
                      console.error('휴게소 위치정보 조회 실패:', textStatus, errorThrown, jqXHR.status, '(pageNo=' + pageNo + ')');
                      // 이미 받은 페이지까지는 반영한다
                      if (allFeatures.length) {
                          restList.getSource().addFeatures(allFeatures);
                          buildSearchIndex(allFeatures);
                      }
                  }
              });
          }
  
          fetchPage(1);
      })();
  
      const weatherMeta = { offset: 0, hourLabel: '' };
  
      (function () {
          const MAX_OFFSET = 5;
  
          function fetchWeather(offset) {
              const base = new Date();
              base.setHours(base.getHours() - offset);
  
              $.ajax({
                  url: 'https://data.ex.co.kr/openapi/restinfo/restWeatherList?',
                  type: 'GET',
                  dataType: 'json',
                  data: {
                      key: EX_KEY,
                      type: 'json',
                      sdate: base.toISOString().slice(0, 10).replace(/-/g, ''),
                      stdHour: String(base.getHours()).padStart(2, '0')
                  },
                  success: function (data) {
                      const list = data.list || [];
                      if (!list.length && offset < MAX_OFFSET) {
                          fetchWeather(offset + 1);
                          return;
                      }
  
                      weatherMeta.offset = offset;
                      weatherMeta.hourLabel = String(base.getHours()).padStart(2, '0') + '시';
                      list.forEach(function (item) {
                          const unitCode = String(item.unitCode).trim();
                          if (!restWeather[unitCode]) {
                              restWeather[unitCode] = [];
                          }
                          restWeather[unitCode].push({
                              contents: item.weatherContents, //현재일기내용
                              temp: item.tempValue, //현재기온
                              discomfore: item.discomforeValue, //불쾌지수값
                              sensory: item.sensoryTemp, //체감온도
                              highest: item.highestTemp, //최고온도
                              lowest: item.lowestTemp, //최저기온
                          });
                      });
                  },
                  error: function (jqXHR, textStatus, errorThrown) {
                      console.error('휴게소 날씨정보 조회 실패:', textStatus, errorThrown, jqXHR.status, '(offset=' + offset + ')');
                      if (offset < MAX_OFFSET) fetchWeather(offset + 1);
                  }
              });
          }
  
          fetchWeather(0);
      })();
  
      const NO_DATA = ['-99.00', '-99.000000', '-99', ''];
      function esc(value) {
          if (value === null || value === undefined) return '';
          return String(value).replace(/[&<>"']/g, function (ch) {
              return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
          });
      }
  
      /** -99 같은 결측치를 걸러 숫자만 돌려준다 */
      function num(value, digits) {
          if (value === null || value === undefined) return null;
          const text = String(value).trim();
          if (NO_DATA.indexOf(text) !== -1) return null;
          const parsed = parseFloat(text);
          if (!isFinite(parsed) || parsed <= -99) return null;
          return digits === undefined ? parsed : parsed.toFixed(digits);
      }
  
      function weatherIcon(contents) {
          const text = contents || '';
          if (text.indexOf('눈') !== -1) return '❄️';
          if (text.indexOf('비') !== -1 || text.indexOf('소나기') !== -1) return '🌧️';
          if (text.indexOf('흐') !== -1) return '☁️';
          if (text.indexOf('구름') !== -1) return '⛅';
          if (text.indexOf('안개') !== -1) return '🌫️';
          if (text.indexOf('맑') !== -1) return '☀️';
          return '🌤️';
      }
  
      function weatherHtml(weather) {
          if (!weather) {
              return '<div class="pop-weather"><span class="w-empty">날씨 정보가 없습니다</span></div>';
          }
  
          const temp = num(weather.temp, 1);
          const chips = [];
          const sensory = num(weather.sensory, 1);
          const highest = num(weather.highest, 1);
          const lowest = num(weather.lowest, 1);
          const discomfort = num(weather.discomfore, 0);
  
          if (sensory !== null) chips.push('체감 ' + sensory + '°');
          if (highest !== null) chips.push('최고 ' + highest + '°');
          if (lowest !== null) chips.push('최저 ' + lowest + '°');
          if (discomfort !== null) chips.push('불쾌지수 ' + discomfort);
  
          return '' +
              '<div class="pop-weather">' +
              '<span class="w-icon">' + weatherIcon(weather.contents) + '</span>' +
              '<div>' +
              '<div class="w-temp">' + (temp !== null ? temp + '°' : '-') + '</div>' +
              '<div class="w-desc">' + esc(weather.contents || '정보 없음') + '</div>' +
              '</div>' +
              (chips.length
                  ? '<div class="w-chips">' + chips.map(function (chip) {
                      return '<span class="w-chip">' + esc(chip) + '</span>';
                  }).join('') + '</div>'
                  : '') +
              '</div>' +
              (weatherMeta.offset > 0
                  ? '<div class="w-note">※ ' + weatherMeta.hourLabel + ' 기준(' + weatherMeta.offset + '시간 전) 날씨 정보입니다</div>'
                  : '');
      }
  
      function listHtml(items, type) {
          if (!items || !items.length) {
              return '<div class="empty">등록된 정보가 없습니다</div>';
          }
          return items.map(function (item) {
              let badge = '';
              if (type === 'food' && item.season && item.season !== '정보 없음') {
                  badge = '<span class="badge season-' + esc(item.season) + '">' + esc(item.season) + '</span>';
              }
              const time = item.time ? '<span class="item-time">' + esc(item.time) + '</span>' : '';
  
              const descParts = [];
              if (item.description) descParts.push(String(item.description).trim());
              if (type === 'food' && item.material && item.material !== '정보 없음') {
                  descParts.push('재료 · ' + item.material);
              }
              const desc = descParts.length
                  ? '<div class="item-desc">' + esc(descParts.join('\n')) + '</div>'
                  : '';
  
              return '<div class="item">' +
                  '<div class="item-top">' +
                  '<span class="item-name">' + esc(item.name) + '</span>' + badge + time +
                  '</div>' + desc +
                  '</div>';
          }).join('');
      }
  
      function headHtml(feature) {
          const route = [feature.get('routeName'), feature.get('routeNo')]
              .filter(Boolean).join(' · ');
          return '<div class="pop-head">' +
              '<button type="button" class="pop-closer" title="닫기">&times;</button>' +
              '<div class="pop-title">' + esc(feature.get('name')) + '</div>' +
              (route ? '<div class="pop-sub">' + esc(route) + '</div>' : '') +
              '</div>';
      }
  
      function tabsHtml(tabs, activeKey) {
          return '<div class="pop-tabs">' + tabs.map(function (tab) {
              return '<button type="button" class="pop-tab' + (tab.key === activeKey ? ' active' : '') + '"' +
                  ' data-tab="' + tab.key + '">' + esc(tab.label) +
                  '<span class="cnt">' + tab.items.length + '</span></button>';
          }).join('') + '</div>';
      }
  
      function openRestPopup(feature, zoom) {
          const name = feature.get('name');
          const unitCode = feature.get('unitCode');
          const weather = (restWeather[unitCode] || [])[0];
          const coordinate = feature.getGeometry().getCoordinates();
  
          popupEl.innerHTML = headHtml(feature) + weatherHtml(weather) +
              '<div class="loading">정보를 불러오는 중…</div>';
          popupEl.classList.add('is-open');
          popup.setPosition(coordinate);
          focusOn(coordinate, zoom);
  
          $.when(restFoodList(name), restBrandList(name), restConvList(name))
              .done(function (foodList, brandList, convList) {
                  if (popupEl.dataset.name !== name) return;
  
                  const tabs = [
                      { key: 'food', label: '먹거리', items: foodList || [] },
                      { key: 'brand', label: '브랜드', items: brandList || [] },
                      { key: 'conv', label: '편의시설', items: convList || [] }
                  ];
                  const active = tabs.find(function (tab) { return tab.items.length; }) || tabs[0];
  
                  popupEl.innerHTML = headHtml(feature) + weatherHtml(weather) +
                      tabsHtml(tabs, active.key) +
                      '<div class="pop-body">' + listHtml(active.items, active.key) + '</div>';
  
                  popupEl.querySelectorAll('.pop-tab').forEach(function (button) {
                      button.addEventListener('click', function () {
                          const key = button.dataset.tab;
                          const tab = tabs.find(function (item) { return item.key === key; });
                          popupEl.querySelectorAll('.pop-tab').forEach(function (other) {
                              other.classList.toggle('active', other === button);
                          });
                          popupEl.querySelector('.pop-body').innerHTML = listHtml(tab.items, key);
                          popupEl.querySelector('.pop-body').scrollTop = 0;
                          focusOn(coordinate, undefined, true);
                      });
                  });
                  focusOn(coordinate, undefined, true);
              })
              .fail(function () {
                  if (popupEl.dataset.name !== name) return;
                  popupEl.innerHTML = headHtml(feature) + weatherHtml(weather) +
                      '<div class="empty">상세 정보를 불러오지 못했습니다</div>';
                  focusOn(coordinate, undefined, true);
              });
  
          popupEl.dataset.name = name;
      }
  
      //예외 상황 대처를 위해 닫기 버튼은 팝업이 새로 그려져도 동작
      popupEl.addEventListener('click', function (e) {
          if (e.target.closest('.pop-closer')) closePopup();
      });
  
  
      const CHOSUNG = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
      const SKIP_CHARS = /[\s()[\]\-·,.'"/]/;
      const MAX_RESULT = 12;
  
      const searchEl = document.getElementById('search');
      const searchInput = document.getElementById('search-input');
      const searchResultEl = document.getElementById('search-result');
  
      let searchIndex = [];
      let searchHits = [];
      let activeIndex = -1;
  
      function normalizeName(name) {
          const chars = [];
          const map = [];
          for (let i = 0; i < name.length; i++) {
              if (SKIP_CHARS.test(name[i])) continue;
              chars.push(name[i].toLowerCase());
              map.push(i);
          }
          return { text: chars.join(''), map: map };
      }
  
      function toChosung(text) {
          let out = '';
          for (let i = 0; i < text.length; i++) {
              const code = text.charCodeAt(i);
              out += (code >= 0xac00 && code <= 0xd7a3)
                  ? CHOSUNG[Math.floor((code - 0xac00) / 588)]
                  : text[i];
          }
          return out;
      }
  
      function range(start, length) {
          const out = [];
          for (let i = 0; i < length; i++) out.push(start + i);
          return out;
      }
  
      function subsequence(haystack, needle) {
          const indices = [];
          let gaps = 0;
          let cursor = 0;
          for (let i = 0; i < needle.length; i++) {
              const found = haystack.indexOf(needle[i], cursor);
              if (found === -1) return null;
              if (indices.length) gaps += found - cursor;
              indices.push(found);
              cursor = found + 1;
          }
          return { indices: indices, gaps: gaps };
      }
  
      function scoreEntry(entry, query, isChosungQuery) {
          const text = entry.norm;
          const size = text.length;
  
          if (text === query) {
              return { score: 1000, indices: range(0, size) };
          }
          const at = text.indexOf(query);
          if (at === 0) {
              return { score: 900 - size, indices: range(0, query.length) };
          }
          if (at > 0) {
              return { score: 800 - at * 5 - size, indices: range(at, query.length) };
          }
  
          if (isChosungQuery) {
              const chosungAt = entry.cho.indexOf(query);
              if (chosungAt === 0) {
                  return { score: 700 - size, indices: range(0, query.length) };
              }
              if (chosungAt > 0) {
                  return { score: 600 - chosungAt * 5 - size, indices: range(chosungAt, query.length) };
              }
          }
  
          const loose = subsequence(text, query) ||
              (isChosungQuery ? null : subsequence(entry.cho, toChosung(query)));
          if (loose && loose.gaps <= 3) {
              return {
                  score: 500 - loose.gaps * 8 - loose.indices[0] * 2 - size,
                  indices: loose.indices
              };
          }
          return null;
      }
  
      function buildSearchIndex(features) {
          searchIndex = features.map(function (feature) {
              const name = feature.get('name') || '';
              const normalized = normalizeName(name);
              return {
                  feature: feature,
                  name: name,
                  norm: normalized.text,
                  map: normalized.map,
                  cho: toChosung(normalized.text),
                  route: [feature.get('routeName'), feature.get('routeNo')].filter(Boolean).join(' · ')
              };
          });
      }
  
      function searchRest(rawQuery) {
          const query = normalizeName(rawQuery).text;
          if (!query) return [];
          const isChosungQuery = /^[ㄱ-ㅎ]+$/.test(query);
  
          return searchIndex
              .map(function (entry) {
                  const matched = scoreEntry(entry, query, isChosungQuery);
                  return matched ? { entry: entry, score: matched.score, indices: matched.indices } : null;
              })
              .filter(Boolean)
              .sort(function (a, b) {
                  return b.score - a.score || a.entry.name.localeCompare(b.entry.name, 'ko');
              })
              .slice(0, MAX_RESULT);
      }
  
      function highlightName(entry, indices) {
          const marked = {};
          indices.forEach(function (index) {
              if (entry.map[index] !== undefined) marked[entry.map[index]] = true;
          });
  
          let html = '';
          let open = false;
          for (let i = 0; i < entry.name.length; i++) {
              if (marked[i] && !open) { html += '<mark>'; open = true; }
              if (!marked[i] && open) { html += '</mark>'; open = false; }
              html += esc(entry.name[i]);
          }
          return open ? html + '</mark>' : html;
      }
  
      function renderSearchResult() {
          if (!searchHits.length) {
              searchResultEl.innerHTML = '<div class="sr-empty">검색 결과가 없습니다</div>';
              searchResultEl.classList.add('is-open');
              return;
          }
          searchResultEl.innerHTML = searchHits.map(function (hit, index) {
              return '<div class="sr-item' + (index === activeIndex ? ' active' : '') + '" data-index="' + index + '">' +
                  '<span class="sr-pin">📍</span>' +
                  '<div>' +
                  '<div class="sr-name">' + highlightName(hit.entry, hit.indices) + '</div>' +
                  (hit.entry.route ? '<div class="sr-route">' + esc(hit.entry.route) + '</div>' : '') +
                  '</div>' +
                  '</div>';
          }).join('');
          searchResultEl.classList.add('is-open');
      }
  
      function closeSearchResult() {
          searchResultEl.classList.remove('is-open');
          activeIndex = -1;
      }
  
      function setActive(index) {
          if (!searchHits.length) return;
          activeIndex = (index + searchHits.length) % searchHits.length;
          const items = searchResultEl.querySelectorAll('.sr-item');
          items.forEach(function (item, i) {
              item.classList.toggle('active', i === activeIndex);
          });
          const current = items[activeIndex];
          if (current) current.scrollIntoView({ block: 'nearest' });
      }
  
      function selectHit(index) {
          const hit = searchHits[index];
          if (!hit) return;
          searchInput.value = hit.entry.name;
          searchEl.classList.add('has-text');
          closeSearchResult();
          searchInput.blur();
  
          openRestPopup(hit.entry.feature, Math.max(map.getView().getZoom(), 15));
      }
  
      searchInput.addEventListener('input', function () {
          const value = searchInput.value;
          searchEl.classList.toggle('has-text', value.length > 0);
          if (!value.trim()) {
              searchHits = [];
              closeSearchResult();
              return;
          }
          searchHits = searchRest(value);
          activeIndex = searchHits.length ? 0 : -1;
          renderSearchResult();
      });
  
      searchInput.addEventListener('keydown', function (e) {
          if (e.key === 'ArrowDown') { e.preventDefault(); setActive(activeIndex + 1); }
          else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(activeIndex - 1); }
          else if (e.key === 'Enter') { e.preventDefault(); selectHit(activeIndex); }
          else if (e.key === 'Escape') { closeSearchResult(); searchInput.blur(); }
      });
  
      searchInput.addEventListener('focus', function () {
          if (searchHits.length) renderSearchResult();
      });
  
      searchResultEl.addEventListener('mousedown', function (e) {
          const item = e.target.closest('.sr-item');
          if (!item) return;
          e.preventDefault();
          selectHit(Number(item.dataset.index));
      });
  
      document.getElementById('search-clear').addEventListener('click', function () {
          searchInput.value = '';
          searchHits = [];
          searchEl.classList.remove('has-text');
          closeSearchResult();
          searchInput.focus();
      });
  
      document.addEventListener('click', function (e) {
          if (!searchEl.contains(e.target)) closeSearchResult();
      });
  
  </script>
  
  </body>
  </html>
